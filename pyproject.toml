[project]
name = "manba-ai"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/bot", "apps/api", "packages/citation-core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]  # pytest assert

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
