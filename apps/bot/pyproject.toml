[project]
name = "manba-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "redis>=5.2",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "fluent.runtime>=0.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]
