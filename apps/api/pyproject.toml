[project]
name = "manba-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.27",
    "selectolax>=0.3",
    "boto3>=1.35",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4",
    "pyotp>=2.9",
    "anthropic>=0.40",
    "citation-core",
    "prometheus-client>=0.21",
    "pypdf>=5.1",
    "bibtexparser>=1.4",
    "rispy>=0.9",
    "rapidfuzz>=3.9",
    "mangum>=0.19",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "httpx", "mypy", "ruff", "aiosqlite"]

[tool.uv.sources]
citation-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
